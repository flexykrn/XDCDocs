name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Build and run QA script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Install Playwright browsers
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Serve site and wait for readiness
        working-directory: website
        run: |
          npm run serve -- --port 3100 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/docs | grep -q "200"; then
              echo "Site is up"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for site"
          exit 1

      - name: Run QA migration script
        working-directory: website
        env:
          NODE_PATH: ${{ github.workspace }}/website/node_modules
        run: node ../scripts/qa-migration.cjs

  links:
    name: External link check (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --exclude-loopback
            --no-progress
            website/**/*.md
            website/docusaurus.config.ts
          failOnError: false

services:
  # Static docs site
  - type: web
    name: xdc-docs-site1
    env: static
    plan: free
    buildCommand: cd website && npm ci && npm run build
    staticPublishPath: website/build
    envVars:
      # set this to the xdc-docs-rag service URL after first deploy, then redeploy
      - key: RAG_API_URL
        sync: false

  # RAG chatbot backend
  - type: web
    name: xdc-docs-rag
    env: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: PINECONE_NAMESPACE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: RAG_CORS_ORIGIN
        sync: false
      - key: FEEDBACK_FILE
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        sync: false
      - key: ENABLE_STREAMING
        sync: false

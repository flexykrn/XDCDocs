services:
  # Static docs site
  - type: web
    name: xdc-docs-site1
    env: static
    buildCommand: cd website && npm ci && npm run build
    staticPublishPath: website/build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Catch-all: serve index.html for client-side routing (Docusaurus SPA)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Predictable Render URL for the xdc-docs-rag service below — baked in so
      # both services deploy correctly on the FIRST blueprint run, no manual
      # dashboard edit + rebuild required. If you attach a custom domain to
      # xdc-docs-rag, update this value and redeploy the static site.
      - key: RAG_API_URL
        value: https://xdc-docs-rag.onrender.com

  # RAG chatbot backend
  - type: web
    name: xdc-docs-rag
    env: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      # Secrets — must be set manually in the Render dashboard.
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Project config — safe defaults, edit here if your setup differs.
      - key: PINECONE_INDEX
        value: xdcdocs
      - key: PINECONE_NAMESPACE
        value: xdc-docs-v1
      # groq deprecates chat models periodically — if chat starts failing with
      # a 404 model_not_found error, check https://console.groq.com/docs/models
      # for a current model id and update this value.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      # Predictable Render URL for xdc-docs-site1 above. Update if you attach
      # a custom domain (e.g. docs.xdc.network) — comma-separate multiple origins.
      - key: RAG_CORS_ORIGIN
        value: https://xdc-docs-site1.onrender.com
      - key: FEEDBACK_FILE
        value: ./data/feedback.jsonl
      - key: RATE_LIMIT_PER_HOUR
        value: "100"
      - key: ENABLE_STREAMING
        value: "true"
